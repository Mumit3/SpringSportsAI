<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Basketball Analytics{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a href="/" class="logo">
      <span class="logo-mark">B</span>
      <span class="logo-text">BASKETBALL ANALYTICS</span>
    </a>

    <nav class="site-nav">
      <a href="/"       class="nav-link {% if request.path == '/' %}active{% endif %}">Sessions</a>
      <a href="/record" class="nav-link {% if request.path.startswith('/record') %}active{% endif %}">Record</a>
    </nav>

    <span class="logo-sub">SDP-113 · BINGHAMTON</span>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
